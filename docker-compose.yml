services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weblog
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/weblog?sslmode=disable
      PORT: "8080"
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - uploads-data:/app/web/static/uploads

volumes:
  db-data:
  uploads-data:
