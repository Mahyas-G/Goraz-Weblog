{{define "content"}}
{{if .Boards}}
<div class="post-grid">
{{range .Boards}}
<a class="post-card" href="/weblog/{{.ID}}">
{{if .ImagePath}}
<div class="post-card-image"><img src="{{.ImagePath}}" alt=""></div>
{{end}}
<div class="post-card-body">
<span class="badge badge-{{.Privacy}}">{{.Privacy}}</span>
<h3 class="post-card-title">{{.Title}}</h3>
<p class="post-card-meta">{{.AuthorUsername}}</p>
<p class="post-card-excerpt">{{.Content}}</p>
<span class="read-more">Read more &rsaquo;</span>
</div>
</a>
{{end}}
</div>
{{else}}
<p class="empty-state">No posts yet. Be the first to share something.</p>
{{end}}
{{end}}
